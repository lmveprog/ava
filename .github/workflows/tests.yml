name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    # ava is a macos app, so there's no point testing her anywhere else.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: install what the suite actually imports
        # not `pip install -e .` on purpose: mlx-whisper, kokoro and vosk are
        # imported lazily and stubbed out in the tests, so pulling ~2 GB of
        # model runtimes would only make ci slow and flaky. these are the
        # packages that get imported the moment a test module loads.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy sounddevice python-dotenv requests PyYAML \
            pywebview "pyobjc-framework-ApplicationServices>=10"

      - name: run the suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check the package still builds
        run: |
          python -m pip install --upgrade pip build
          python -m build
