<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ava</title>
  <!-- the design matheus loves: the jarvis overlay — a living orb in a glass
       pill, and stacked glass cards. no chat window, no "fake window" feel:
       floating surfaces on a transparent overlay, colour = current state. -->
  <style>
    :root{
      --ink: rgba(251,251,251,0.92);
      --ink-soft: rgba(251,251,251,0.55);
      --ink-faint: rgba(251,251,251,0.34);
      --glass: rgba(20,20,24,0.55);
      --hair: rgba(255,255,255,0.07);
      --accent: 122,134,150;            /* current state, r,g,b (set by js) */
      font-synthesis:none; -webkit-font-smoothing:antialiased;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; overflow:hidden; }
    html{ background:radial-gradient(120% 90% at 80% 0%, #141418 0%, #0a0a0c 45%, #060607 100%); }
    html.overlay, html.overlay body{ background:transparent !important; }
    body{
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      color:var(--ink);
      display:flex; align-items:flex-start; justify-content:flex-end;
      padding:14px;
    }
    #stage{ display:flex; flex-direction:column; align-items:flex-end; gap:12px; width:100%; }
    .hidden{ display:none !important; }

    /* every floating surface shares the same glass */
    .glass{
      background:var(--glass);
      -webkit-backdrop-filter:blur(22px) saturate(1.3); backdrop-filter:blur(22px) saturate(1.3);
      box-shadow:
        inset 0 0 0 1px var(--hair),
        inset 0 1px 0 0 rgba(255,255,255,0.05),
        0 18px 50px -18px rgba(0,0,0,0.8),
        0 0 0 1px rgba(0,0,0,0.25);
      transform-origin:top right;
      transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);
    }
    .glass.gone{ opacity:0; transform:scale(.9) translateY(-6px); pointer-events:none; }

    /* ------- the state pill (orb + text) ------- */
    .pill{
      display:inline-flex; align-items:center; gap:14px;
      height:74px; padding:9px 14px 9px 9px; border-radius:999px;
    }
    .orb-wrap{ position:relative; width:56px; height:56px; flex:0 0 auto; }
    canvas.orb{ position:absolute; inset:-16px; width:88px; height:88px; }
    .label{ display:flex; flex-direction:column; gap:2px; min-width:0; }
    .kicker{ font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
      color:var(--ink-faint); font-weight:600; transition:color .4s ease; }
    .status{ font-size:17px; line-height:1.35; color:var(--ink-soft);
      white-space:nowrap; max-width:250px; overflow:hidden; text-overflow:ellipsis;
      font-weight:450; letter-spacing:.005em; }
    .status .dots::after{ content:""; animation:dots 1.4s steps(4,end) infinite; }
    @keyframes dots{ 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} 100%{content:""} }
    .pill-actions{ display:flex; align-items:center; gap:2px; margin-left:4px; }
    .icon-btn{
      width:30px; height:30px; flex:0 0 auto; display:grid; place-items:center;
      border:0; cursor:pointer; color:var(--ink-faint); background:transparent;
      border-radius:50%; opacity:0; transform:scale(.9);
      transition:opacity .3s ease, color .25s ease, background .25s ease, transform .25s ease;
    }
    .pill:hover .icon-btn{ opacity:1; transform:none; }
    .icon-btn:hover{ color:var(--ink); background:rgba(255,255,255,0.06); }
    .icon-btn:focus-visible{ outline:2px solid rgba(var(--accent),0.9); outline-offset:2px; opacity:1; }

    /* ------- captions: what ava says, revealed word by word ------- */
    .caption{ max-width:392px; padding:14px 18px; border-radius:20px; }
    .cap-who{
      font-size:10px; letter-spacing:.2em; text-transform:uppercase;
      color:rgba(var(--accent),0.9); font-weight:700; margin-bottom:6px;
    }
    .cap-who::before{
      content:""; display:inline-block; width:5px; height:5px; border-radius:50%;
      background:rgb(var(--accent)); margin-right:7px; vertical-align:1.5px;
      box-shadow:0 0 7px rgba(var(--accent),0.85);
    }
    .cap-text{ font-size:15px; line-height:1.5; color:var(--ink); font-weight:450;
      letter-spacing:.005em; max-height:38vh; overflow:auto; }
    .cap-text::-webkit-scrollbar{ width:0; }
    .cw{ display:inline-block; opacity:0; animation:cw-in .7s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes cw-in{
      0%{ opacity:0; transform:translateY(4px); filter:blur(5px); color:rgb(var(--accent)); }
      35%{ opacity:1; transform:none; filter:blur(0); color:rgb(var(--accent)); }
      100%{ opacity:1; transform:none; filter:blur(0); color:var(--ink); }
    }
    .cw.unsaid{ animation:none; opacity:.28; color:var(--ink-faint); }
    .caret{ display:inline-block; width:2px; height:1.05em; margin-left:2px;
      vertical-align:-0.15em; border-radius:2px; background:rgb(var(--accent));
      animation:caret-blink 1s steps(2) infinite; }
    .caret.gone{ opacity:0; animation:none; }
    @keyframes caret-blink{ 50%{ opacity:0; } }

    /* what YOU said (transcript final) : a slimmer echo above the answer */
    .caption.you{ padding:10px 16px; background:rgba(255,255,255,0.045); }
    .caption.you .cap-who{ color:var(--ink-faint); }
    .caption.you .cap-who::before{ background:var(--ink-faint); box-shadow:none; }
    .caption.you .cap-text{ font-size:13.5px; color:var(--ink-soft); }

    /* live transcript while you talk */
    .caption.live .cap-text{ color:var(--ink-soft); font-size:14px; min-height:1.4em; }

    /* choices inside the caption flow */
    .choices{ display:flex; gap:9px; margin-top:11px; }
    .choice{
      font:inherit; font-size:13.5px; font-weight:560; padding:8px 15px;
      border-radius:11px; cursor:pointer; border:1px solid var(--hair);
      background:transparent; color:var(--ink-soft);
      transition:background .2s ease, color .2s ease, filter .2s ease;
    }
    .choice:hover{ background:rgba(255,255,255,0.05); color:var(--ink); }
    .choice.yes{ background:rgb(var(--accent)); border-color:transparent; color:#0a0a0c; }
    .choice.yes:hover{ filter:brightness(1.1); }

    /* screenshot preview */
    .preview{ max-width:392px; padding:10px; border-radius:18px; }
    .preview img{ display:block; width:100%; border-radius:12px; }
    .preview .cap-who{ margin:8px 4px 2px; }

    /* sources under an answer */
    .sources{ max-width:392px; padding:11px 14px; border-radius:16px; }
    .src{
      display:block; width:100%; text-align:left; border:0; background:transparent;
      cursor:pointer; font:inherit; padding:6px 6px; border-radius:9px;
      color:var(--ink-soft); font-size:12.5px; line-height:1.35;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .src:hover{ background:rgba(255,255,255,0.05); color:var(--ink); }
    .src b{ color:rgba(var(--accent),0.95); font-weight:650; margin-right:7px; }

    /* ------- text input : a slim glass pill, not a chat window ------- */
    .ask{ display:flex; align-items:center; gap:8px; width:392px;
      padding:7px 8px 7px 16px; border-radius:999px; }
    .ask input{
      flex:1; min-width:0; border:0; outline:0; background:transparent;
      font:inherit; font-size:14px; color:var(--ink);
    }
    .ask input::placeholder{ color:var(--ink-faint); }
    .ask .go, .ask .mic{
      width:34px; height:34px; border-radius:50%; border:0; cursor:pointer;
      display:grid; place-items:center; flex:0 0 auto;
      color:var(--ink-faint); background:transparent;
      transition:background .2s ease, color .2s ease, filter .2s ease;
    }
    .ask .mic:hover{ color:var(--ink); background:rgba(255,255,255,0.06); }
    .ask .mic.active{ color:rgb(var(--accent)); }
    .ask .go{ background:rgb(var(--accent)); color:#0a0a0c; }
    .ask .go:hover{ filter:brightness(1.12); }

    /* ------- boot card (what opens at wake-up) ------- */
    .boot{ position:relative; width:320px; padding:20px 20px 16px; border-radius:22px; }
    .boot-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
    .boot-title{ font-size:15px; font-weight:600; color:var(--ink); }
    .boot-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
    .rows{ display:flex; flex-direction:column; gap:2px; }
    .row{ display:flex; align-items:center; gap:11px; padding:8px 6px; border-radius:12px;
      opacity:0; transform:translateY(6px);
      transition:opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1), background .3s ease; }
    .row.in{ opacity:1; transform:none; }
    .row.done{ background:rgba(255,255,255,0.03); }
    .dot{ position:relative; width:18px; height:18px; flex:0 0 auto; border-radius:50%;
      box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.18); }
    .dot .spin{ position:absolute; inset:0; border-radius:50%; border:1.5px solid transparent;
      border-top-color:rgba(var(--accent),0.95); border-right-color:rgba(var(--accent),0.5);
      animation:spin .7s linear infinite; }
    .row.done .dot{ box-shadow:inset 0 0 0 1.5px rgba(var(--accent),0.9); background:rgba(var(--accent),0.16); }
    .row.done .spin{ display:none; }
    .check{ position:absolute; inset:0; display:grid; place-items:center; opacity:0; transform:scale(.6);
      transition:opacity .25s ease, transform .25s cubic-bezier(.2,.9,.3,1.4); }
    .row.done .check{ opacity:1; transform:none; }
    .check svg{ width:11px; height:11px; }
    @keyframes spin{ to{ transform:rotate(360deg) } }
    .row-name{ font-size:14px; color:var(--ink-soft); }
    .row.done .row-name{ color:var(--ink); }
    .row-tag{ margin-left:auto; font-size:10.5px; color:var(--ink-faint); letter-spacing:.16em; text-transform:uppercase; }

    /* ------- the morning card (startup scene) ------- */
    .brief{
      position:relative; width:392px; max-height:88vh; overflow:hidden auto;
      padding:22px 22px 18px; border-radius:24px;
      background:
        radial-gradient(130% 80% at 15% -10%, rgba(var(--accent),0.18), transparent 60%),
        var(--glass);
    }
    .brief::-webkit-scrollbar{ width:0; }
    .brief::before{
      content:""; position:absolute; top:0; left:10%; right:10%; height:1.5px; border-radius:2px;
      background:linear-gradient(90deg, transparent, rgba(var(--accent),0.85) 35%,
        rgba(255,255,255,0.9) 50%, rgba(var(--accent),0.85) 65%, transparent);
      background-size:220% 100%; animation:sheen 5.5s ease-in-out infinite; pointer-events:none;
    }
    @keyframes sheen{ 0%,100%{ background-position:120% 0; opacity:.55; } 50%{ background-position:-20% 0; opacity:1; } }
    .brief.startup-size{ width:100%; max-width:660px; }
    .brief-date{ font-size:10.5px; letter-spacing:.24em; text-transform:uppercase;
      color:rgba(var(--accent),0.9); font-weight:700; }
    .brief-hi{ font-size:27px; line-height:1.12; font-weight:650; letter-spacing:-.01em;
      color:var(--ink); margin-top:5px;
      background:linear-gradient(92deg, var(--ink), rgba(var(--accent),1) 55%, var(--ink));
      -webkit-background-clip:text; background-clip:text; }
    .brief-weather{ display:flex; align-items:center; gap:14px; margin-top:18px; }
    .wx-glyph{ width:52px; height:52px; flex:0 0 auto; color:rgba(var(--accent),1); }
    .wx-glyph svg{ width:100%; height:100%; display:block; overflow:visible; }
    .wx-main{ display:flex; flex-direction:column; gap:1px; min-width:0; }
    .wx-temp{ font-size:26px; font-weight:600; color:var(--ink); line-height:1; letter-spacing:-.02em; }
    .wx-desc{ font-size:13px; color:var(--ink-soft); text-transform:capitalize; }
    .wx-range{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
    .wx-range b{ color:var(--ink-soft); font-weight:600; }
    .brief-card{ margin-top:14px; padding:13px 15px; border-radius:16px;
      background:rgba(255,255,255,0.035); border:1px solid var(--hair); }
    .brief-eyebrow{ display:flex; align-items:center; gap:7px; font-size:10px;
      letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint);
      font-weight:700; margin-bottom:7px; }
    .brief-eyebrow .pulse{ width:6px; height:6px; border-radius:50%; background:rgba(var(--accent),1);
      box-shadow:0 0 0 0 rgba(var(--accent),0.6); animation:pulse 1.8s ease-out infinite; }
    @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(var(--accent),0.55);} 70%{ box-shadow:0 0 0 7px rgba(var(--accent),0);} 100%{ box-shadow:0 0 0 0 rgba(var(--accent),0);} }
    .brief-news{ font-size:13.5px; line-height:1.4; color:var(--ink); }
    .brief-src{ font-size:11px; color:var(--ink-faint); margin-top:5px; }
    .brief-card.quote{ position:relative; overflow:hidden;
      background:rgba(var(--accent),0.06); border-color:rgba(var(--accent),0.16); }
    .brief-card.quote::before{
      content:"\201C"; position:absolute; top:-14px; right:6px;
      font-family:Georgia, "Times New Roman", serif; font-size:74px; line-height:1;
      color:rgba(var(--accent),0.16); pointer-events:none; }
    .brief-quote{ position:relative; font-size:14px; line-height:1.45;
      color:var(--ink-soft); font-style:italic; }
    .brief-author{ margin-top:6px; font-size:11px; color:var(--ink-faint); font-style:normal; }
    /* the spoken briefing, karaoke-timed on the real audio */
    .brief-say{ margin-top:14px; font-size:13.5px; line-height:1.55; color:var(--ink-soft);
      max-height:150px; overflow:auto; }
    .brief-say::-webkit-scrollbar{ width:0; }
    .rw{ display:inline-block; opacity:0; filter:blur(7px); transform:translateY(7px);
      animation:rw-in .55s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rw-in{ to{ opacity:1; filter:blur(0); transform:none; } }

    .wx-sun{ transform-origin:center; animation:wx-spin 22s linear infinite; }
    @keyframes wx-spin{ to{ transform:rotate(360deg); } }
    .wx-cloud{ animation:wx-drift 5s ease-in-out infinite; }
    @keyframes wx-drift{ 0%,100%{ transform:translateX(-1.2px);} 50%{ transform:translateX(1.2px);} }
    .wx-drop{ animation:wx-fall 1.3s ease-in infinite; }
    .wx-drop:nth-child(2){ animation-delay:.25s; }
    .wx-drop:nth-child(3){ animation-delay:.5s; }
    @keyframes wx-fall{ 0%{ transform:translateY(-2px); opacity:0;} 30%{opacity:1;} 100%{ transform:translateY(5px); opacity:0;} }
    .wx-bolt{ animation:wx-flash 2.4s steps(1) infinite; }
    @keyframes wx-flash{ 0%,92%,100%{opacity:.35;} 94%,98%{opacity:1;} }

    /* ------- memory card (obsidian vault) ------- */
    .memory{ width:392px; max-height:320px; overflow-y:auto; padding:14px 16px; border-radius:18px; }
    .memory::-webkit-scrollbar{ width:0; }
    .mem-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
    .mem-title{ display:flex; align-items:center; gap:7px; color:var(--ink-faint);
      font-size:10px; font-weight:700; letter-spacing:.17em; text-transform:uppercase; }
    .mem-title .pulse{ width:6px; height:6px; border-radius:50%; background:rgb(var(--accent));
      box-shadow:0 0 0 0 rgba(var(--accent),.55); animation:pulse 1.8s ease-out infinite; }
    .mem-vault{ border:0; background:transparent; cursor:pointer; color:rgba(var(--accent),.9);
      font:inherit; font-size:11px; font-weight:600; padding:3px 7px; border-radius:8px; }
    .mem-vault:hover{ background:rgba(var(--accent),.1); }
    .mem-sub{ margin:9px 0 5px; color:var(--ink-faint); font-size:10px; font-weight:700;
      letter-spacing:.14em; text-transform:uppercase; }
    .mem-line{ color:var(--ink-soft); font-size:12.5px; line-height:1.55; margin:3px 0; }
    .mem-empty{ color:var(--ink-faint); font-size:12px; font-style:italic; }
    .wl{ display:inline-block; border:0; cursor:pointer; font:inherit; font-size:11.5px;
      font-weight:600; color:rgb(var(--accent)); padding:1px 8px; margin:0 1px;
      border-radius:999px; background:rgba(var(--accent),.1);
      box-shadow:inset 0 0 0 1px rgba(var(--accent),.22);
      transition:background .2s ease, box-shadow .2s ease, transform .15s ease; }
    .wl:hover{ background:rgba(var(--accent),.2); transform:translateY(-1px);
      box-shadow:inset 0 0 0 1px rgba(var(--accent),.45), 0 4px 14px -6px rgba(var(--accent),.6); }

    /* ------- settings ------- */
    .settings{ position:relative; width:392px; max-height:82vh; overflow:hidden;
      display:flex; flex-direction:column; border-radius:22px; }
    .set-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; }
    .set-title{ font-size:15px; font-weight:600; color:var(--ink); }
    .set-close{ border:0; background:transparent; color:var(--ink-faint); cursor:pointer;
      font-size:15px; width:26px; height:26px; border-radius:8px; }
    .set-close:hover{ color:var(--ink); background:rgba(255,255,255,0.06); }
    .set-body{ padding:4px 18px 10px; overflow-y:auto; display:flex; flex-direction:column; gap:13px; }
    .field{ display:flex; flex-direction:column; gap:6px; }
    .field > span{ font-size:11px; letter-spacing:.04em; color:var(--ink-faint);
      text-transform:uppercase; font-weight:600; }
    .field > span b{ color:var(--ink-soft); float:right; font-weight:600; }
    .field input[type=text], .field textarea{
      width:100%; font:inherit; font-size:13.5px; color:var(--ink);
      background:rgba(255,255,255,0.04); border:1px solid var(--hair); border-radius:10px;
      padding:9px 11px; resize:vertical; transition:border-color .2s ease, background .2s ease; }
    .field input:focus, .field textarea:focus{ outline:none;
      border-color:rgba(var(--accent),0.8); background:rgba(255,255,255,0.06); }
    .field input[type=range]{ width:100%; accent-color:rgb(var(--accent)); }
    .set-note{ font-size:11.5px; color:var(--ink-faint); min-height:14px; }
    .set-note.ok{ color:rgb(67,224,160); }
    .set-note.err{ color:rgb(245,120,110); }
    .set-foot{ display:flex; justify-content:flex-end; gap:10px; padding:12px 18px 16px;
      border-top:1px solid rgba(255,255,255,0.05); }
    .btn{ font:inherit; font-size:13.5px; font-weight:550; padding:9px 16px; border-radius:11px;
      cursor:pointer; border:1px solid transparent; }
    .btn.ghost{ background:transparent; color:var(--ink-soft); border-color:var(--hair); }
    .btn.ghost:hover{ background:rgba(255,255,255,0.05); color:var(--ink); }
    .btn.primary{ background:rgb(var(--accent)); color:#0a0a0c; }
    .btn.primary:hover{ filter:brightness(1.1); }

    @media (prefers-reduced-motion: reduce){
      *{ animation-duration:.001ms !important; transition-duration:.12s !important; }
      .wx-sun,.wx-cloud,.wx-drop,.wx-bolt,.pulse{ animation:none !important; }
      .rw,.cw{ opacity:1 !important; filter:none !important; transform:none !important; }
    }
  </style>
</head>
<body>
<div id="stage">

  <!-- morning / startup card -->
  <section class="glass brief gone" id="brief" aria-hidden="true">
    <div class="brief-date" id="bDate">—</div>
    <h1 class="brief-hi" id="bHi">Bonjour</h1>
    <div class="brief-weather" id="bWeather">
      <div class="wx-glyph" id="bGlyph"></div>
      <div class="wx-main">
        <div class="wx-temp" id="bTemp"></div>
        <div class="wx-desc" id="bDesc"></div>
        <div class="wx-range" id="bRange"></div>
      </div>
    </div>
    <div class="brief-card news" id="bNewsCard">
      <div class="brief-eyebrow"><span class="pulse"></span> Actu IA</div>
      <div class="brief-news" id="bNews"></div>
      <div class="brief-src" id="bSrc"></div>
    </div>
    <div class="brief-card quote" id="bQuoteCard">
      <div class="brief-eyebrow">✦ Citation du jour</div>
      <blockquote class="brief-quote" id="bQuote"></blockquote>
      <div class="brief-author" id="bAuthor"></div>
    </div>
    <div class="brief-say" id="bSay"></div>
  </section>

  <!-- boot card -->
  <section class="glass boot gone" id="boot" aria-hidden="true">
    <header class="boot-head">
      <div>
        <div class="boot-title">Ava prépare ton espace</div>
        <div class="boot-sub" id="bootSub">Un instant…</div>
      </div>
    </header>
    <div class="rows" id="rows"></div>
  </section>

  <!-- the state pill -->
  <section class="glass pill gone" id="pill" role="status" aria-live="polite">
    <div class="orb-wrap"><canvas id="orbMain" class="orb"></canvas></div>
    <div class="label">
      <span class="kicker" id="kicker">Ava</span>
      <span class="status" id="status">Prête</span>
    </div>
    <div class="pill-actions">
      <button class="icon-btn" id="memoryBtn" title="Mémoire (vault Obsidian)" aria-label="Mémoire">
        <svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v14H6.5a2.5 2.5 0 0 0 0 5H19"/><path d="M9 8h7M9 11.5h4.5"/></svg>
      </button>
      <button class="icon-btn" id="gear" title="Réglages" aria-label="Réglages">

<script>
window.addEventListener("error", e => { window.__lastError = e.message + " @" + e.lineno; });
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const api = () => (window.pywebview && window.pywebview.api) || null;
  const escapeHtml = s => String(s == null ? "" : s)
    .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // ---- state palette (the artifact) ----
  const STATES = {
    idle:      { rgb:[122,134,150], energy:0.16, kicker:"Ava",        status:"Prête" },
    listening: { rgb:[46,208,224],  energy:0.95, kicker:"À l'écoute", status:"Je t'écoute" },
    thinking:  { rgb:[139,124,246], energy:0.7,  kicker:"Réflexion",  status:"Un instant", dots:true },
    speaking:  { rgb:[67,224,160],  energy:0.85, kicker:"Réponse",    status:"" },
    action:    { rgb:[245,166,35],  energy:0.8,  kicker:"Action",     status:"" },
    booting:   { rgb:[245,166,35],  energy:0.8,  kicker:"Démarrage",  status:"Je prépare ton espace" },
    error:     { rgb:[255,105,126], energy:0.6,  kicker:"Petit souci", status:"" },
  };

  // ---- the orb ----
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v,a,b)=> v<a?a:v>b?b:v;
  class Orb {
    constructor(canvas){
      this.c = canvas; this.ctx = canvas.getContext("2d");
      this.dpr = Math.min(window.devicePixelRatio||1, 2);
      this.cur = { rgb:[122,134,150], energy:0.16 };
      this.tgt = { rgb:[122,134,150], energy:0.16 };
      this.mode = "idle"; this.level = 0;
      this.blobs = Array.from({length:5}, (_,i)=>({
        a: Math.random()*Math.PI*2, r: 0.24 + Math.random()*0.34,
        s: (0.4 + Math.random()*0.9) * (i%2?1:-1), sz: 0.34 + Math.random()*0.22 }));
      this.spin = 0; this.rings = []; this.sparks = []; this.ringT = 0;
      this.bloom = 0; this.talk = 0;
      this.resize(); window.addEventListener("resize", ()=>this.resize());
    }
    resize(){
      const r = this.c.getBoundingClientRect();
      this.w = Math.max(1, r.width); this.h = Math.max(1, r.height);
      this.c.width = this.w*this.dpr; this.c.height = this.h*this.dpr;
      this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    }
    set(rgb, energy, mode){
      this.tgt.rgb = rgb.slice(); this.tgt.energy = energy;
      if(mode && mode !== this.mode){ this.mode = mode; this.bloom = 1; }
    }
    _lerp(a,b,t){ return a+(b-a)*t; }
    frame(dt, t){
      const ctx = this.ctx, cx=this.w/2, cy=this.h/2;
      const CR = Math.min(this.w,this.h)/2, R0 = CR*0.56;
      for(let i=0;i<3;i++) this.cur.rgb[i]=this._lerp(this.cur.rgb[i],this.tgt.rgb[i], 0.07);
      this.cur.energy = this._lerp(this.cur.energy, this.tgt.energy + this.level*0.35, 0.08);
      this.bloom = Math.max(0, this.bloom - dt*0.0022);
      const e = clamp(this.cur.energy + this.bloom*0.5, 0, 1.3);
      const [r,g,b] = this.cur.rgb.map(v=>Math.round(v));
      const lite = k => [Math.min(r+k,255),Math.min(g+k,255),Math.min(b+k,255)];
      ctx.clearRect(0,0,this.w,this.h);
      this.talk += dt*0.006*(this.mode==="speaking"?1:0.35);
      const wob = this.mode==="speaking" ? Math.sin(this.talk)*0.05 + Math.sin(this.talk*2.3)*0.025 : 0;
      const breathe = 1 + Math.sin(t*0.0016)*(0.02+0.04*e) + wob + this.bloom*0.05;
      const R = Math.min(R0*breathe, CR*0.7);
      if(!REDUCED && this.mode==="listening"){
        this.ringT += dt;
        if(this.ringT > 700){ this.ringT = 0; this.rings.push({r:R, a:1}); }
      }
      for(const ring of this.rings){ ring.r += dt*0.02; ring.a -= dt*0.0016; }
      this.rings = this.rings.filter(x=> x.a>0 && x.r < CR);
      for(const ring of this.rings){
        const fade = clamp(ring.a * (1 - ring.r/CR), 0, 1);
        ctx.strokeStyle = `rgba(${r},${g},${b},${fade*0.5})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx,cy,ring.r,0,7); ctx.stroke();
      }
      const halo = ctx.createRadialGradient(cx,cy,R*0.6, cx,cy,CR);
      halo.addColorStop(0, `rgba(${r},${g},${b},${0.22+0.30*e})`);
      halo.addColorStop(0.55,`rgba(${r},${g},${b},${0.08+0.12*e})`);
      halo.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx,cy,CR,0,7); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip();
      const base = ctx.createRadialGradient(cx-R*0.3,cy-R*0.36,R*0.1, cx,cy,R*1.12);
      base.addColorStop(0, `rgb(${(r*0.58)|0},${(g*0.58)|0},${(b*0.60)|0})`);
      base.addColorStop(1, `rgb(${(r*0.12)|0},${(g*0.12)|0},${(b*0.15)|0})`);
      ctx.fillStyle = base; ctx.fillRect(cx-R,cy-R,R*2,R*2);
      ctx.globalCompositeOperation = "screen";
      for(const bl of this.blobs){
        bl.a += bl.s * dt * (0.0004 + 0.0018*e);
        const bx = cx + Math.cos(bl.a)*R*bl.r, by = cy + Math.sin(bl.a*1.3)*R*bl.r;
        const br = R*bl.sz*(0.8+0.45*e);
        const [lr,lg,lb] = lite(80);
        const gg = ctx.createRadialGradient(bx,by,0, bx,by,br);
        gg.addColorStop(0, `rgba(${lr},${lg},${lb},${0.55*e+0.16})`);
        gg.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(bx,by,br,0,7); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
      const spec = ctx.createRadialGradient(cx-R*0.32,cy-R*0.42,0, cx-R*0.32,cy-R*0.42,R*0.95);
      spec.addColorStop(0,"rgba(255,255,255,0.62)");
      spec.addColorStop(0.16,"rgba(255,255,255,0.14)");
      spec.addColorStop(0.5,"rgba(255,255,255,0)");
      ctx.fillStyle = spec; ctx.fillRect(cx-R,cy-R,R*2,R*2);
      ctx.restore();
      const [rr,rg,rb] = lite(95);
      ctx.lineWidth = 1;
      ctx.strokeStyle = `rgba(${rr},${rg},${rb},${0.38+0.32*e})`;
      ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke();
      if(!REDUCED && this.mode==="thinking"){
        this.spin += dt*0.005;
        const ar = clamp(R + 6, 0, CR - 2);
        const ag = ctx.createLinearGradient(cx-ar,cy,cx+ar,cy);
        ag.addColorStop(0, `rgba(${rr},${rg},${rb},0)`);
        ag.addColorStop(1, `rgba(${rr},${rg},${rb},0.9)`);
        ctx.strokeStyle = ag; ctx.lineWidth = 2; ctx.lineCap="round";
        ctx.beginPath(); ctx.arc(cx,cy,ar,this.spin,this.spin+2.1); ctx.stroke();
        const hx = cx+Math.cos(this.spin+2.1)*ar, hy = cy+Math.sin(this.spin+2.1)*ar;
        ctx.fillStyle = `rgba(${rr},${rg},${rb},0.95)`;
        ctx.beginPath(); ctx.arc(hx,hy,2.2,0,7); ctx.fill();
      }
      if(!REDUCED && this.mode==="action" && Math.random()<0.25){
        const a = Math.random()*Math.PI*2;
        this.sparks.push({x:cx+Math.cos(a)*R*0.7, y:cy+Math.sin(a)*R*0.7,
                          vx:Math.cos(a)*0.018, vy:Math.sin(a)*0.018-0.006, life:1});
      }
      for(const s of this.sparks){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt*0.0018; }
      this.sparks = this.sparks.filter(s=> s.life>0 && Math.hypot(s.x-cx,s.y-cy) < CR-1);
      for(const s of this.sparks){
        ctx.fillStyle = `rgba(${rr},${rg},${rb},${clamp(s.life,0,1)})`;
        ctx.beginPath(); ctx.arc(s.x,s.y,1.4,0,7); ctx.fill();
      }
    }
  }
  const orb = new Orb($("orbMain"));
  let last = performance.now();
  (function loop(now){
    const dt = Math.min(64, now-last); last = now;
    orb.frame(dt, now);
    requestAnimationFrame(loop);
  })(last);

  // ---- helpers ----
  const show = el => el.classList.remove("gone");
  const hide = el => el.classList.add("gone");
  function setAccent(rgb){ document.documentElement.style.setProperty("--accent", rgb.join(",")); }

  const pill = $("pill"), statusEl = $("status"), kickerEl = $("kicker");
  let currentState = "idle";
  function setState(name, label){
    const s = STATES[name] || STATES.idle;
    currentState = name in STATES ? name : "idle";
    setAccent(s.rgb); orb.set(s.rgb, s.energy, currentState);
    kickerEl.textContent = s.kicker;
    statusEl.innerHTML = s.dots
      ? `${escapeHtml(label || s.status)}<span class="dots"></span>`
      : escapeHtml(label != null && label !== "" ? label : s.status);
    show(pill); show($("ask"));
    if(name === "listening"){ show($("liveCard")); $("liveText").textContent = ""; }
    else hide($("liveCard"));
    $("micBtn").classList.toggle("active", name === "listening");
  }

  // ---- captions ----
  const caption = $("caption"), captionText = $("captionText");
  let capWords = [], sayTimer = null;
  function revealCaption(text, delays){
    captionText.innerHTML = "";
    capWords = [];
    const parts = String(text == null ? "" : text).split(/(\s+)/);
    let wi = 0; const start = 60, step = 55;
    parts.forEach(part => {
      if(/^\s*$/.test(part)){ captionText.appendChild(document.createTextNode(part)); return; }
      const s = document.createElement("span");
      s.className = "cw"; s.textContent = part;
      const at = (delays && delays[wi] != null) ? Number(delays[wi]) : (start + wi*step);
      s.style.animationDelay = at + "ms";
      s.dataset.at = at;
      captionText.appendChild(s); capWords.push(s); wi++;
    });
    const caret = document.createElement("span"); caret.className = "caret";
    captionText.appendChild(caret);
    show(caption); captionText.scrollTop = 0;
    if(sayTimer) clearTimeout(sayTimer);
    const total = capWords.length ? Number(capWords[capWords.length-1].dataset.at) : 0;
    sayTimer = setTimeout(() => caret.classList.add("gone"), total + 500);
    caption._born = performance.now();
  }

  // ---- backend api (the 23 entry points) ----
  window.avaOverlayMode = () => document.documentElement.classList.add("overlay");
  window.avaReady = () => {};
  window.avaSetState = (state, label) => {
    setState(state, label);
    if(state === "listening" || state === "thinking") { hide(caption); hide($("sources")); hide($("preview")); }
  };
  window.avaIdle = () => setState("idle");
  window.avaError = (text) => { setState("error"); revealCaption(text || "Je n'ai pas pu terminer."); };
  window.avaShow = () => { show(pill); show($("ask")); };
  window.avaHide = () => hide(pill);
  window.avaDormant = () => {
    ["pill","ask","caption","youCard","liveCard","boot","brief","settings",
     "memoryPanel","preview","sources"].forEach(id => hide($(id)));
  };
  window.avaLevel = v => { orb.level = clamp(Number(v)||0, 0, 1); };
  window.avaTranscript = (text, final) => {
    if(final){
      hide($("liveCard"));
      if(text){ $("youText").textContent = text; show($("youCard")); }
      return;
    }
    if(text){ show($("liveCard")); $("liveText").textContent = text; }
  };
  window.avaMessage = (role, text, _visual, delays) => {
    if(role === "user"){
      $("youText").textContent = text || ""; if(text) show($("youCard"));
      return;
    }
    hide($("liveCard"));
    revealCaption(text || "", Array.isArray(delays) && delays.length ? delays : null);
  };
  window.avaInterrupted = () => {
    // grey out what was NOT said: the reveal times tell us where she stopped.
    const elapsed = performance.now() - (caption._born || 0);
    for(const w of capWords) if(Number(w.dataset.at) > elapsed) w.classList.add("unsaid");
  };
  window.avaChoices = (prompt, yes, no) => {
    if(prompt) revealCaption(prompt);
    $("choiceYes").textContent = yes || "Oui";
    $("choiceNo").textContent = no || "Non";
    $("choices").classList.remove("hidden");
    show(caption);
  };
  window.avaClearChoices = () => $("choices").classList.add("hidden");
  window.avaPreview = (src, cap) => {
    $("previewImg").src = src || "";
    $("previewCap").textContent = cap || "";
    show($("preview"));
  };
  window.avaSources = (list) => {
    const box = $("sources"); box.innerHTML = "";
    (list || []).slice(0, 4).forEach((s, i) => {
      const b = document.createElement("button");
      b.className = "src";
      b.innerHTML = `<b>${i+1}</b>${escapeHtml(s.title || s.url || "")}`;
      b.addEventListener("click", () => { const a = api(); if(a && a.open_url) a.open_url(s.url); });
      box.appendChild(b);
    });
    if(box.children.length) show(box); else hide(box);
  };

  // boot card
  const rowsEl = $("rows");
  const CHECK = '<span class="check"><svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.2 2.3L9.6 3.6" stroke="rgba(255,255,255,0.95)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  window.avaBoot = (apps, sub) => {
    if(sub) $("bootSub").textContent = sub;
    rowsEl.innerHTML = "";
    (apps||[]).forEach(name => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="dot"><span class="spin"></span>${CHECK}</span>`+
                      `<span class="row-name">${escapeHtml(name)}</span>`+
                      `<span class="row-tag">ouverture</span>`;
      rowsEl.appendChild(row);
    });
    show($("boot"));
    [...rowsEl.children].forEach((row,i)=> setTimeout(()=>row.classList.add("in"), 90*i+120));
  };
  window.avaBootStep = (i) => {
    const row = rowsEl.children[i]; if(!row) return;
    row.classList.add("in","done");
    const tag = row.querySelector(".row-tag"); if(tag) tag.textContent = "prêt";
  };
  window.avaBootDone = () => hide($("boot"));

  // morning card
  function revealInto(el, text, startMs, stepMs){
    el.innerHTML = "";
    const parts = String(text == null ? "" : text).split(/(\s+)/);
    let wi = 0;
    parts.forEach(part => {
      if(/^\s*$/.test(part)){ el.appendChild(document.createTextNode(part)); return; }
      const span = document.createElement("span");
      span.className = "rw"; span.textContent = part;
      span.style.animationDelay = (startMs + wi*stepMs) + "ms";
      el.appendChild(span); wi++;
    });
    return startMs + wi*stepMs;
  }
  const WX = {
    clear: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><g class="wx-sun"><circle cx="24" cy="24" r="8" fill="currentColor" stroke="none" opacity=".9"/><g opacity=".9"><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11 11l3.5 3.5M33.5 33.5 37 37M37 11l-3.5 3.5M14.5 33.5 11 37"/></g></g></svg>`,
    partly: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><g class="wx-sun" opacity=".85"><circle cx="18" cy="17" r="6" fill="currentColor" stroke="none"/><g><path d="M18 4v3M18 27v3M5 17h3M28 17h3M9 8l2 2M25 24l2 2M27 8l-2 2M11 24l-2 2"/></g></g><path class="wx-cloud" d="M16 32a7 7 0 0 1 13.4-2.8A6 6 0 1 1 31 41H17a5 5 0 0 1-1-9z" fill="currentColor" stroke="none" opacity=".92"/></svg>`,
    cloudy: `<svg viewBox="0 0 48 48" fill="none" stroke="none"><path class="wx-cloud" d="M14 34a8 8 0 0 1 15.2-3.3A7 7 0 1 1 31 44H15a6 6 0 0 1-1-10z" fill="currentColor" opacity=".9"/></svg>`,
    rain: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path class="wx-cloud" d="M14 26a8 8 0 0 1 15.2-3.3A7 7 0 1 1 31 36H15a6 6 0 0 1-1-10z" fill="currentColor" stroke="none" opacity=".92"/><g opacity=".85"><path class="wx-drop" d="M17 40v3"/><path class="wx-drop" d="M24 40v4"/><path class="wx-drop" d="M31 40v3"/></g></svg>`,
    snow: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path class="wx-cloud" d="M14 26a8 8 0 0 1 15.2-3.3A7 7 0 1 1 31 36H15a6 6 0 0 1-1-10z" fill="currentColor" stroke="none" opacity=".92"/><g opacity=".85" class="wx-drop"><path d="M18 41h.01M24 42h.01M30 41h.01"/></g></svg>`,
    storm: `<svg viewBox="0 0 48 48" fill="none" stroke="none"><path class="wx-cloud" d="M14 24a8 8 0 0 1 15.2-3.3A7 7 0 1 1 31 34H15a6 6 0 0 1-1-10z" fill="currentColor" opacity=".9"/><path class="wx-bolt" d="M25 33l-7 8h5l-2 6 8-9h-5z" fill="currentColor"/></svg>`,
    fog: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path class="wx-cloud" d="M14 22a8 8 0 0 1 15.2-3.3A7 7 0 1 1 31 32H15a6 6 0 0 1-1-10z" fill="currentColor" stroke="none" opacity=".9"/><g opacity=".7"><path d="M12 38h20M14 43h18"/></g></svg>`,
  };
  function glyphFor(code){
    if(code === 0) return "clear";
    if(code === 1 || code === 2) return "partly";
    if(code === 3) return "cloudy";
    if(code === 45 || code === 48) return "fog";
    if([71,73,75,77,85,86].includes(code)) return "snow";
    if([95,96,99].includes(code)) return "storm";
    if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "rain";
    return "partly";
  }
  let startupTimer = null;
  window.avaStartup = (p) => {
    p = p || {};
    // the scene ends itself: after `duration` the backend's finish_startup
    // shrinks the window back to the corner and brings the pill in. without
    // this call the app waits forever and no pill ever shows.
    if(startupTimer){ clearTimeout(startupTimer); startupTimer = null; }
    if(p.auto_finish !== false){
      const secs = Math.max(3, Number(p.duration) || 9);
      startupTimer = setTimeout(() => {
        startupTimer = null;
        const a = api();
        if(a && a.finish_startup) a.finish_startup();
        else window.avaStartupDone();
      }, secs * 1000);
    }
    setAccent(STATES.speaking.rgb); orb.set(STATES.speaking.rgb, 0.85, "speaking");
    $("bDate").textContent = p.date || "";
    const w = p.weather;
    if(w){
      $("bWeather").style.display = "";
      $("bGlyph").innerHTML = WX[glyphFor(Number(w.code)||0)] || WX.partly;
      $("bTemp").textContent = (w.temp != null ? w.temp + "°" : "");
      $("bDesc").textContent = w.desc || "";
      $("bRange").innerHTML = (w.tmax != null)
        ? `↑ <b>${w.tmax}°</b>&nbsp;&nbsp;↓ <b>${w.tmin}°</b>&nbsp;&nbsp;· ${escapeHtml(w.city || p.city || "")}`
        : escapeHtml(w.city || p.city || "");
    } else $("bWeather").style.display = "none";
    if(p.news && !p.loading){
      $("bNewsCard").style.display = "";
      $("bSrc").textContent = [p.source, p.freshness].filter(Boolean).join(" · ");
    } else $("bNewsCard").style.display = "none";
    if(p.quote){
      $("bQuoteCard").style.display = "";
      $("bAuthor").textContent = p.quote_author ? "— " + p.quote_author : "";
    } else $("bQuoteCard").style.display = "none";
    show($("brief"));
    let t = 120;
    t = revealInto($("bHi"), `${p.hello || "Bonjour"} ${p.name || ""}`.trim(), t, 55) + 120;
    if(p.news && !p.loading) t = revealInto($("bNews"), "« " + p.news + " »", t, 30) + 80;
    if(p.quote) revealInto($("bQuote"), "« " + p.quote + " »", t, 26);
  };
  window.avaStartupBrief = (text, _ms, marks) => {
    // the spoken briefing, karaoke-timed on the audio actually playing
    const el = $("bSay"); el.innerHTML = "";
    const parts = String(text == null ? "" : text).split(/(\s+)/);
    let wi = 0;
    parts.forEach(part => {
      if(/^\s*$/.test(part)){ el.appendChild(document.createTextNode(part)); return; }
      const s = document.createElement("span");
      s.className = "rw"; s.textContent = part;
      const at = (marks && marks[wi] != null) ? Number(marks[wi]) : wi*140;
      s.style.animationDelay = at + "ms";
      el.appendChild(s); wi++;
    });
    show($("brief"));
    const follow = setInterval(() => {
      if($("brief").classList.contains("gone")){ clearInterval(follow); return; }
      el.scrollTop = el.scrollHeight;
    }, 800);
  };
  window.avaStartupDone = () => {
    if(startupTimer){ clearTimeout(startupTimer); startupTimer = null; }
    hide($("brief")); setState("idle");
  };
  window.avaOpenSettings = () => openSettings();

  // ---- input, choices, memory, settings wiring ----
  function submit(text){
    const a = api(); if(!a || !a.submit_text) return;
    a.submit_text(text);
  }
  $("askGo").addEventListener("click", () => {
    const v = $("askInput").value.trim();
    if(v){ submit(v); $("askInput").value = ""; }
  });
  $("askInput").addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); $("askGo").click(); }
  });
  $("micBtn").addEventListener("click", () => {
    const a = api(); if(a && a.start_listening) a.start_listening();
  });
  $("choiceYes").addEventListener("click", () => { $("choices").classList.add("hidden"); submit($("choiceYes").textContent); });
  $("choiceNo").addEventListener("click", () => { $("choices").classList.add("hidden"); submit($("choiceNo").textContent); });

  // memory card
  const memBody = $("memBody");
  function renderMemLine(line){
    return escapeHtml(line).replace(/\[\[([^\]]+)\]\]/g,
      (_, name) => `<button class="wl" data-note="${name}">${name}</button>`);
  }
  async function refreshMemory(){
    const a = api();
    if(!a || !a.memory_snapshot){
      memBody.innerHTML = '<div class="mem-empty">Disponible quand Ava tourne.</div>'; return;
    }
    let snap = null;
    try{ snap = await a.memory_snapshot(); }catch(e){ snap = null; }
    if(!snap){ memBody.innerHTML = '<div class="mem-empty">Mémoire indisponible.</div>'; return; }
    let html = "";
    if((snap.facts||[]).length){
      html += '<div class="mem-sub">🧠 Retenu</div>';
      for(const f of snap.facts.slice(-6).reverse()) html += `<div class="mem-line">${renderMemLine(f)}</div>`;
    }
    if((snap.journal||[]).length){
      html += '<div class="mem-sub">📓 Aujourd’hui</div>';
      for(const l of snap.journal.slice(-10).reverse()) html += `<div class="mem-line">${renderMemLine(l)}</div>`;
    }
    memBody.innerHTML = html || '<div class="mem-empty">Rien encore aujourd’hui. Dis « retiens que… » ou « prends note de… ».</div>';
  }
  memBody.addEventListener("click", e => {
    const link = e.target.closest(".wl");
    const a = api();
    if(link && a && a.open_note) a.open_note(link.dataset.note);
  });
  $("memoryBtn").addEventListener("click", () => {
    const panel = $("memoryPanel");
    const opening = panel.classList.contains("gone");
    panel.classList.toggle("gone");
    if(opening) refreshMemory();
  });
  $("memVault").addEventListener("click", () => {
    const a = api(); if(a && a.open_vault) a.open_vault();
  });

  // settings
  const F = { name:$("fName"), city:$("fCity"), sens:$("fSens"),
              sensVal:$("fSensVal"), phrases:$("fPhrases"), apps:$("fApps") };
  F.sens.addEventListener("input", () => { F.sensVal.textContent = F.sens.value; });
  async function openSettings(){
    const a = api();
    $("setNote").textContent = ""; $("setNote").className = "set-note";
    let cfg = null;
    if(a && a.get_config){ try{ cfg = await a.get_config(); }catch(e){ cfg = null; } }
    cfg = cfg || {};
    F.name.value = (cfg.identity && cfg.identity.name) || "";
    F.city.value = (cfg.identity && cfg.identity.city) || "";
    F.sens.value = (cfg.wake && cfg.wake.clap && cfg.wake.clap.sensitivity != null) ? cfg.wake.clap.sensitivity : 50;
    F.sensVal.textContent = F.sens.value;
    F.phrases.value = ((cfg.wake && cfg.wake.phrases) || []).join("\n");
    F.apps.value = ((cfg.morning && cfg.morning.apps) || []).map(x => `${x.name}, ${x.position}`).join("\n");
    show($("settings"));
  }
  function closeSettings(){ hide($("settings")); }
  async function saveSettings(){
    const a = api();
    const apps = F.apps.value.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
      const i = l.lastIndexOf(",");
      const name = (i < 0 ? l : l.slice(0, i)).trim();
      let pos = (i < 0 ? "tl" : l.slice(i + 1)).trim().toLowerCase();
      if(!["tl","tr","bl","br","small"].includes(pos)) pos = "tl";
      return { name, position: pos };
    });
    const phrases = F.phrases.value.split("\n").map(s => s.trim().toLowerCase()).filter(Boolean);
    const patch = {
      identity: { name: F.name.value.trim(), city: F.city.value.trim() },
      wake: { phrases, clap: { sensitivity: parseInt(F.sens.value, 10) } },
      morning: { apps },
    };
    if(!a || !a.save_config){ $("setNote").textContent = "Non connecté."; $("setNote").className = "set-note err"; return; }
    try{
      const res = await a.save_config(patch);
      if(res && res.error){ $("setNote").textContent = "Erreur : " + res.error; $("setNote").className = "set-note err"; return; }
      $("setNote").textContent = "Enregistré ✓"; $("setNote").className = "set-note ok";
      setTimeout(closeSettings, 850);
    }catch(e){ $("setNote").textContent = "Erreur : " + e; $("setNote").className = "set-note err"; }
  }
  $("gear").addEventListener("click", () => $("settings").classList.contains("gone") ? openSettings() : closeSettings());
  $("setClose").addEventListener("click", closeSettings);
  $("setCancel").addEventListener("click", closeSettings);
  $("setSave").addEventListener("click", saveSettings);

  // ---- standalone demo (open the file in a browser to see the design) ----
  let controlled = false;
  const claim = () => { controlled = true; };
  ["avaSetState","avaMessage","avaStartup","avaBoot","avaTranscript"].forEach(fn => {
    const original = window[fn];
    window[fn] = (...args) => { claim(); return original(...args); };
  });
  setTimeout(() => {
    if(controlled) return;
    window.avaStartup({
      name:"Matheus", hello:"Bonjour", date:"MARDI 11 AOÛT", city:"Marseille",
      weather:{ city:"Marseille", temp:31, code:1, desc:"plutôt dégagé", tmax:33, tmin:24 },
      news:"Meta relance Muse Glimmer, son outil local, autonome, multimodal et open source",
      source:"Hugging Face", freshness:"hier",
      quote:"Deviens ce que tu es.", quote_author:"Pindare",
    });
    setTimeout(() => {
      window.avaStartupDone();
      const script = [
        ["listening", null, null, 2600],
        ["thinking", null, null, 2200],
        ["speaking", null, "Il est quatorze heures trente-deux.", 3200],
        ["action", null, "J'ouvre Spotify et je lance ta playlist.", 3000],
        ["idle", null, null, 2400],
      ];
      let i = 0;
      (function tick(){
        const [st,, say, hold] = script[i % script.length];
        setState(st);
        if(say) revealCaption(say);
        if(st === "idle") hide(caption);
        i++; setTimeout(tick, hold);
      })();
    }, 7000);
    controlled = false;
  }, 900);
})();
</script>
</body>
</html>
